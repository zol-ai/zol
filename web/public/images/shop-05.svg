<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A technician carrying a parts box past the shelving in an auto repair shop, with the bay door open to daylight">
  <defs>
    <linearGradient id="s5-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede3"/><stop offset="1" stop-color="#ddd3c3"/>
    </linearGradient>
    <linearGradient id="s5-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b9a9"/><stop offset="1" stop-color="#aca090"/>
    </linearGradient>
    <linearGradient id="s5-day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <radialGradient id="s5-glow" cx="0.74" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fffdf7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#s5-wall)"/>

  <!-- open bay door to daylight, right -->
  <g>
    <rect x="720" y="150" width="440" height="540" fill="url(#s5-day)"/>
    <rect x="720" y="150" width="440" height="540" fill="none" stroke="#c7bba7" stroke-width="10"/>
    <!-- rolled-up door slats above -->
    <rect x="712" y="96" width="456" height="60" rx="6" fill="#cfc4b2"/>
    <g stroke="#bcb09c" stroke-width="3"><path d="M712 116h456M712 136h456"/></g>
    <!-- a car waiting outside, kept simple and pale -->
    <g opacity="0.34">
      <path d="M790 560 l0 -46 q0 -20 22 -25 l84 -14 q12 -32 46 -32 l96 0 q34 0 44 30 l60 14 q20 5 20 26 l0 47 z" fill="#6f7883"/>
      <circle cx="860" cy="560" r="34" fill="#4a515a"/>
      <circle cx="1064" cy="560" r="34" fill="#4a515a"/>
    </g>
  </g>

  <!-- parts shelving, left -->
  <g>
    <rect x="50" y="180" width="480" height="510" fill="#e5dbca" stroke="#c7bba7" stroke-width="5"/>
    <g stroke="#c7bba7" stroke-width="6">
      <path d="M50 300h480M50 420h480M50 540h480"/>
    </g>
    <!-- boxes and cans -->
    <g>
      <rect x="70" y="212" width="96" height="84" rx="4" fill="#b4463a"/>
      <rect x="180" y="226" width="80" height="70" rx="4" fill="#356394"/>
      <rect x="274" y="216" width="104" height="80" rx="4" fill="#c9a227"/>
      <rect x="392" y="232" width="90" height="64" rx="4" fill="#4c8c5a"/>

      <rect x="70" y="336" width="84" height="80" rx="4" fill="#8a929c"/>
      <rect x="168" y="348" width="100" height="68" rx="4" fill="#b4463a"/>
      <rect x="282" y="330" width="88" height="86" rx="4" fill="#356394"/>
      <rect x="384" y="344" width="98" height="72" rx="4" fill="#c9a227"/>

      <!-- oil bottles -->
      <g fill="#3f6f4a">
        <rect x="76" y="462" width="34" height="74" rx="6"/><rect x="120" y="462" width="34" height="74" rx="6"/>
        <rect x="164" y="462" width="34" height="74" rx="6"/><rect x="208" y="462" width="34" height="74" rx="6"/>
      </g>
      <g fill="#2b2f34">
        <rect x="82" y="452" width="22" height="14" rx="4"/><rect x="126" y="452" width="22" height="14" rx="4"/>
        <rect x="170" y="452" width="22" height="14" rx="4"/><rect x="214" y="452" width="22" height="14" rx="4"/>
      </g>
      <!-- coiled hose -->
      <g fill="none" stroke="#4c545d" stroke-width="10">
        <circle cx="380" cy="490" r="40"/><circle cx="380" cy="490" r="24"/>
      </g>
      <!-- tyres stacked on the bottom shelf -->
      <g fill="#2b2f34">
        <rect x="70" y="566" width="150" height="34" rx="17"/>
        <rect x="70" y="606" width="150" height="34" rx="17"/>
        <rect x="70" y="646" width="150" height="34" rx="17"/>
      </g>
      <rect x="270" y="574" width="220" height="106" rx="6" fill="#a8998a"/>
      <path d="M270 620h220" stroke="#8d8271" stroke-width="4"/>
    </g>
  </g>

  <rect width="1200" height="900" fill="url(#s5-glow)"/>

  <!-- floor -->
  <rect x="0" y="690" width="1200" height="210" fill="url(#s5-floor)"/>
  <path d="M0 690h1200" stroke="#9d917d" stroke-width="4"/>
  <!-- light spilling in from the open door -->
  <path d="M720 690 L1160 690 L1080 900 L560 900 Z" fill="#fffdf7" opacity="0.34"/>

  <!-- technician walking a parts box across the floor -->
  <g fill="#37312a">
    <circle cx="612" cy="366" r="40"/>
    <path d="M576 356 q36 -38 74 -4 l16 -10 q-46 -44 -98 -2 z"/>
    <path d="M574 412 q38 -18 76 0 l24 150 q-62 20 -126 0 z"/>
    <!-- arms out, carrying -->
    <path d="M578 424 q-40 30 -34 78 l26 -2 q-4 -34 26 -54 z"/>
    <path d="M648 424 q42 28 38 78 l-26 -2 q2 -34 -28 -54 z"/>
    <!-- legs mid stride -->
    <path d="M588 562 l-26 128 l-44 0 l34 -132 z"/>
    <path d="M646 562 l36 122 l-44 8 l-30 -122 z"/>
  </g>
  <path d="M580 420 q34 -16 68 0" fill="none" stroke="#fdfaf4" stroke-width="5" opacity="0.35"/>

  <!-- the box -->
  <g>
    <rect x="546" y="480" width="140" height="96" rx="6" fill="#c9a227"/>
    <path d="M546 516 h140" stroke="#a8811a" stroke-width="5"/>
    <path d="M616 480v96" stroke="#a8811a" stroke-width="5"/>
    <rect x="576" y="496" width="80" height="4" rx="2" fill="#8a6a15" opacity="0.6"/>
  </g>

  <g fill="#8d8271" opacity="0.3">
    <ellipse cx="608" cy="696" rx="90" ry="13"/>
  </g>
</svg>
